name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APK
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/release/app-release.apk build/artifacts/SimpleTranslate-v1.1.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/SimpleTranslate-v1.1.0-debug.apk
          ls -lh build/artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTranslate-APKs
          path: build/artifacts/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "SimpleTranslate v1.1.0 (Google Proxy, Image Translation & Enhanced Voice)"
          body: |
            ## 🎉 SimpleTranslate 极简谷歌翻译 Android APP v1.1.0 重磅发布

            ### 🚀 核心新特性与全面升级
            - 🌐 **内置 Google 翻译引擎（免 Key / 官方直连与美国服务器中转代理双模）**：
              - 客户端免 Key 即可调用 Google 官方高质量翻译。
              - 内置美国专用中转服务器代理（默认预置 `http://129.151.9.55:8787`），彻底解决国内网络无法直连 Google 的痛点；支持海外网络一键切换官方直连模式。
              - 提供配套开源轻量级代理服务端（位于 `/server`），纯标准库零外部依赖，守护进程即开即用。
            - 📷 **图片与拍照翻译（高精度离线 OCR）**：
              - 完美复刻 Google 翻译界面相机入口，提供“拍照识别”与“相册导入”双入口。
              - 集成 Google ML Kit 离线文字识别引擎，毫秒级快速提取中英日韩等多国语言文字，无缝填入并自动触发翻译。
            - 🎙️ **强化语音引擎（STT 录音输入与高保真 TTS 朗读）**：
              - 全面强化 TTS 语音合成：多语种高保真发音智能匹配、异步初始化队列自动重放、超长文本分句连续朗读、错误友好提示。
              - 强化 STT 语音识别：完善麦克风录音权限优雅引导、多语种动态语调偏好匹配、系统缺少语音组件友好拦截。
            - 🔑 **多翻译引擎全面支持**：
              - 支持 Google 翻译、百度翻译开放平台、网易有道智云、腾讯云机器翻译及离线 Mock 引擎自由切换。

            ### 📦 安装包下载
            - [SimpleTranslate-v1.1.0-release.apk](SimpleTranslate-v1.1.0-release.apk) (正式发布版)
            - [SimpleTranslate-v1.1.0-debug.apk](SimpleTranslate-v1.1.0-debug.apk) (调试版)
          files: |
            build/artifacts/SimpleTranslate-v1.1.0-release.apk
            build/artifacts/SimpleTranslate-v1.1.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
