name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APK
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/release/app-release.apk build/artifacts/SimpleTranslate-v1.3.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/SimpleTranslate-v1.3.0-debug.apk
          ls -lh build/artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTranslate-APKs
          path: build/artifacts/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "SimpleTranslate v1.3.0 (Google-Grade In-Place AR Image Translation & Fullscreen Overlay Viewer)"
          body: |
            ## 🎉 SimpleTranslate 极简谷歌翻译 Android APP v1.3.0 重磅发布

            ### 🚀 核心新特性与全面升级
            - 🖼️ **原位实景图片翻译 (Google-Grade In-Place AR Image Translation Overlay)**：
              - 彻底告别以往仅将 OCR 识别文字提取填入文本框的初级体验，深度对标 Google 翻译与微信图片翻译标准体验！
              - 利用 Google ML Kit 离线文本识别精准提取每个段落文本块的矩形坐标区域 (`boundingBox: Rect`)；
              - 采用边缘颜色采样算法智能计算图片背景底色，在原图对应位置绘制微圆角纯色遮罩层；
              - 根据底色明暗对比度动态调整文字前景色（亮底深字/暗底白字），结合 `StaticLayout` 自适应字号 (Auto-sizing) 动态排版，让图片上的英文“直接变中文”，毫无违和感！
            - 📱 **专属全屏沉浸式图片翻译查看器 (ImageTranslateScreen)**：
              - 拍照或从相册选图后直接进入专属全屏沉浸式图片翻译页，免去繁琐跳转；
              - **底部浮动控制栏**：支持一键秒切【显示译文】/【显示原文】，便于对照原文核对细节；
              - **手势缩放与拖拽**：支持双指 1.0x ~ 5.0x 无级平滑缩放与自由拖拽平移，双击快速在 1.0x 与 2.5x 间切换；
              - **交互点击查看与发音**：点击图片上任意翻译文本块，醒目蓝色外框高亮聚焦，底部弹出精致卡片，展示原文、译文，支持一键单独复制与 TTS 语音发音朗读！
              - **贴心辅助功能**：右上角菜单支持一键“复制全部提取文本”、“保存翻译后的图片”至系统相册、以及“导入主输入框编辑”。
            - ⚡ **并发批量翻译与去重缓存**：
              - 文本块并发批量送入翻译引擎，内置并发控制与重复文本自动去重缓存，既极速响应又彻底杜绝 API 限流。
            - 🔊 **保留双模 TTS 与自动语言对调**：
              - 本地 TTS 优先 + 在线发音兜底双模支持；
              - AUTO 模式下智能中英双向对调。

            ### 📦 安装包下载
            - [SimpleTranslate-v1.3.0-release.apk](SimpleTranslate-v1.3.0-release.apk) (正式发布版)
            - [SimpleTranslate-v1.3.0-debug.apk](SimpleTranslate-v1.3.0-debug.apk) (调试版)
          files: |
            build/artifacts/SimpleTranslate-v1.3.0-release.apk
            build/artifacts/SimpleTranslate-v1.3.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
