name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APK
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/release/app-release.apk build/artifacts/SimpleTranslate-v1.2.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/SimpleTranslate-v1.2.0-debug.apk
          ls -lh build/artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTranslate-APKs
          path: build/artifacts/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "SimpleTranslate v1.2.0 (Dual-Mode TTS & Smart Bidirectional Auto Translation)"
          body: |
            ## 🎉 SimpleTranslate 极简谷歌翻译 Android APP v1.2.0 重磅发布

            ### 🚀 核心新特性与全面升级
            - 🔊 **语音朗读重大升级：本地 TTS + 在线网络发音音频双模兜底（Fallback）**：
              - 彻底解决小米澎湃OS、华为、OPPO、vivo 等绝大多数国产安卓真机因未预装 Google TTS 引擎或缺少离线语音包导致点击喇叭无声的痛点！
              - 本地 TTS 不可用或缺语言包时，立即自动平滑无缝切换到免 Key 高保真在线网络音频流发音（有道发音 + 美国中转代理 TTS + Google TTS 免 Key 接口）。
              - 规范使用 `STREAM_MUSIC` 媒体音频流，并在手机媒体音量为 0 或静音模式时提供友好提示。
              - 在 `AndroidManifest.xml` 中声明 `TTS_SERVICE` 查询意图，全面适配 Android 11+ 包可见性机制。
            - 🔄 **自动检测模式下的智能中英互译双向对调**：
              - 当源语言为【自动检测 (AUTO)】时，随用户输入或粘贴实时智能识别语种特征：
                - 输入中文 -> 自动将目标语言动态对齐切换为英文 (`Language.EN`)，执行中译英；
                - 输入英文及其他语种 -> 自动将目标语言动态对齐切换为中文 (`Language.ZH`)，执行英译中；
              - 界面目标语言动态同步联动，支持用户随时手动切换，彻底根除“中译中”尴尬情况。
            - 🌐 **内置 Google 翻译引擎与轻量中转代理服务端**：
              - 内置免 Key 官方直连与美国专用中转代理服务器双模支持。
              - 中转代理服务端新增 `/api/tts` 高保真语音流代理端点。

            ### 📦 安装包下载
            - [SimpleTranslate-v1.2.0-release.apk](SimpleTranslate-v1.2.0-release.apk) (正式发布版)
            - [SimpleTranslate-v1.2.0-debug.apk](SimpleTranslate-v1.2.0-debug.apk) (调试版)
          files: |
            build/artifacts/SimpleTranslate-v1.2.0-release.apk
            build/artifacts/SimpleTranslate-v1.2.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
