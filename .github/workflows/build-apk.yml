name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --no-daemon

      - name: Build Release & Debug APK
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/release/app-release.apk build/artifacts/SimpleTranslate-v1.3.2-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/SimpleTranslate-v1.3.2-debug.apk
          ls -lh build/artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTranslate-APKs
          path: build/artifacts/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          name: "SimpleTranslate v1.3.2 (Super Slim Release: arm64-v8a ABI Filter & R8/Resource Shrink 54MB -> 16MB)"
          body: |
            ## 🚀 SimpleTranslate 极简谷歌翻译 Android APP v1.3.2 极致瘦身版 (54MB ➡️ 16MB)

            ### ⚡ 核心瘦身成果与技术优化
            - 📉 **体积暴降 70%**：Release APK 体积由原本臃肿的 **54MB** 大幅骤降至 **16MB**，秒速下载与安装！
            - 🎯 **现代架构精准适配 (arm64-v8a ABI Filter)**：
              - 剔除冗余的历史 32 位与模拟器架构（x86, x86_64, armeabi-v7a），仅保留现代 Android 真机标准 64 位核心动态库；
              - 单项去除多余 ML Kit OCR 动态库占用达 30MB+。
            - 🛡️ **全面启用 R8 混淆优化与无用资源缩减 (isMinifyEnabled & isShrinkResources)**：
              - 启用 R8 死代码剥离与无用资源裁剪，classes.dex 体积由 45MB 优化至仅 5.7MB；
              - 针对 ML Kit OCR、OkHttp3、Gson、Coroutines、Jetpack Compose 等关键底层框架严密配置 Proguard 保留规则，保证极致体积的同时具备 100% 运行时稳定性与业务可用性。

            ### 📦 安装包下载直链
            - [SimpleTranslate-v1.3.2-release.apk](https://github.com/Jakliuyuy/SimpleTranslate/releases/download/v1.3.2/SimpleTranslate-v1.3.2-release.apk) (正式发布版 - 极致瘦身 16MB)
            - [SimpleTranslate-v1.3.2-debug.apk](https://github.com/Jakliuyuy/SimpleTranslate/releases/download/v1.3.2/SimpleTranslate-v1.3.2-debug.apk) (调试版)
          files: |
            build/artifacts/SimpleTranslate-v1.3.2-release.apk
            build/artifacts/SimpleTranslate-v1.3.2-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
