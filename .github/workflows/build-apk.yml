name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APK
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/release/app-release.apk build/artifacts/SimpleTranslate-v1.3.1-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/SimpleTranslate-v1.3.1-debug.apk
          ls -lh build/artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTranslate-APKs
          path: build/artifacts/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: "SimpleTranslate v1.3.1 (Fix: 100% In-Place Mask, Left Alignment, Compact OCR Boxes & Line-Height Adaptation)"
          body: |
            ## 🚀 SimpleTranslate 极简谷歌翻译 Android APP v1.3.1 视觉与排版专项修复版

            ### 🛠️ 核心视觉排版缺陷修复与全面优化
            - 🛡️ **彻底根除原文字透光重影 (100% 完全不透明遮罩 + 3px 安全外扩)**：
              - 废除原 94% 半透明遮罩（`alpha = 242/240`），背景遮罩画笔强制统一为 `100% 完全不透明 (alpha = 255)`；
              - 增加 `expandRect` 矩形安全向外膨胀机制（默认向外扩展 3 像素），彻底物理擦除原英文墨迹与抗锯齿边缘，杜绝中英重叠鬼影乱码。
            - 📐 **全面恢复自然左对齐排版 (ALIGN_NORMAL)**：
              - 废除硬编码居中对齐（`ALIGN_CENTER`），切换为 `Layout.Alignment.ALIGN_NORMAL` 标准左对齐；
              - 多行文本从文本框左上角自然向下向右展开排布，杜绝垂直强制居中造成的上下大片空白脱节。
            - 🎯 **行级紧凑包围盒聚合 (Compact Bounding Box from Lines)**：
              - 深度解析 Google ML Kit 的 `textBlock.lines`，优先采用行级包围盒的并集计算紧凑外接矩形；
              - 彻底解决短消息气泡遮罩比原气泡宽、溢出到空白区的问题，同时紧密完全包含长文本所有行，消除漏字。
            - 🔠 **多行段落行高与字号动态自适应**：
              - 针对多行段落，基于行数与平均行高动态估算合理字号基准，并优化行距与段落换行规范化，让译文舒展自然填满原文字区域。

            ### 📦 安装包下载
            - [SimpleTranslate-v1.3.1-release.apk](https://github.com/Jakliuyuy/SimpleTranslate/releases/download/v1.3.1/SimpleTranslate-v1.3.1-release.apk) (正式发布版)
            - [SimpleTranslate-v1.3.1-debug.apk](https://github.com/Jakliuyuy/SimpleTranslate/releases/download/v1.3.1/SimpleTranslate-v1.3.1-debug.apk) (调试版)
          files: |
            build/artifacts/SimpleTranslate-v1.3.1-release.apk
            build/artifacts/SimpleTranslate-v1.3.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
